<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Учёт рекламы">

<title>Учёт рекламы</title>
<style>
:root{
  --bg:#0d1117;--panel:#151b23;--panel2:#1b2330;--line:#28323f;--line2:#344153;
  --text:#e8edf3;--muted:#8a97a8;--dim:#5f6c7d;
  --accent:#2dd4bf;--accent-ink:#04201c;--accent-soft:rgba(45,212,191,.13);
  --blue:#6ea8fe;--warn:#fbbf24;--warn-soft:rgba(251,191,36,.13);--bad:#f87171;--bad-soft:rgba(248,113,113,.13);--good:#4ade80;
  --r:12px;--r-sm:8px;--side:224px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body.noscroll{overflow:hidden}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px;font-weight:650}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.mono{font-family:var(--mono)}
.hide{display:none!important}

/* layout */
#app{display:flex;min-height:100vh}
.side{width:var(--side);flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:700;font-size:15px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-weight:800;font-size:13px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:550}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--warn);color:#241a00;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.side .grow{flex:1}
.nav .sm{display:none}
.sync{font-size:12px;color:var(--muted);padding:8px 10px;display:flex;align-items:center;gap:8px}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.sync.ok b{background:var(--good)}.sync.busy b{background:var(--warn)}.sync.err b{background:var(--bad)}
main{flex:1;min-width:0;padding:24px 28px 60px;max-width:1280px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .sp{flex:1}
.mtop{display:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:15px;height:15px}

/* ui */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:14px}
.grid>.card,.grid>div>.card{margin-top:0!important}
.filters input[type=checkbox]{min-width:0;width:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:550}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{background:transparent}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn.done{color:var(--good)}
input,select,textarea{background:#0f141b;border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-height:38px;outline:none}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:auto;min-height:0}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:5px;color:var(--text);font-weight:400;font-size:14px}
label.chk{display:inline-flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.geo{color:var(--blue)}.chip.src{color:var(--accent)}
button.chip{cursor:pointer;font-family:var(--mono);color:var(--text)}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
button.chip.done{border-color:var(--good);color:var(--good)}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.ok{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{width:auto;min-width:110px}
.filters input.search{min-width:220px;flex:1;max-width:380px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tfoot td{font-weight:700;background:var(--panel2)}
.tw.card-pad{padding:0}
td.wrap{white-space:normal}

/* partner list */
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) 130px minmax(0,1fr) 110px 150px 110px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.h{background:var(--panel2);font-size:12px;color:var(--muted);font-weight:600;padding:8px 14px}
a.prow{color:inherit}
a.prow:hover{background:rgba(255,255,255,.03)}
.pname{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{display:block;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis}

/* progress */
.prog{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.bar i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px;opacity:.85}
.bar.cur i{opacity:1;background:var(--blue)}
.bar span{font-size:10px;color:var(--muted);margin-top:6px;white-space:nowrap}
.bar em{font-style:normal;font-size:10px;color:var(--text);position:absolute;top:-2px;transform:translateY(-100%);white-space:nowrap}
.hb{display:grid;grid-template-columns:90px 1fr 100px;gap:10px;align-items:center;padding:5px 0}
.hb .t{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* list blocks */
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .lb{font-weight:600;min-width:110px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.li .val.code{color:var(--text);font-size:14px}
.rem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--text);margin-bottom:8px;border:1px solid rgba(251,191,36,.25)}
.rem.bad{background:var(--bad-soft);border-color:rgba(248,113,113,.28)}
.rem svg{color:var(--warn);margin-top:2px}.rem.bad svg{color:var(--bad)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 86px;gap:6px}
.cal .hd{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:4px 0}
.day{min-height:76px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left}
.day:hover{border-color:var(--line2)}
.day.out{opacity:.4}.day.today{border-color:var(--blue)}.day.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day b{font-size:12px;color:var(--muted)}.day .n{font-size:11px;color:var(--accent);font-weight:700}.day .s{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.wk{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 4px;font-size:12px}
.wk b{font-size:13px;font-variant-numeric:tabular-nums}.wk span{color:var(--muted);font-size:11px}

/* modal / toast */
.modal-back{position:fixed;inset:0;background:rgba(3,6,10,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:520px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.modal.wide{max-width:760px}
.modal h2{font-size:17px;margin-bottom:14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#e8edf3;color:#0d1117;padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sugg{border:1px solid var(--line2);border-radius:var(--r-sm);margin-top:6px;overflow:hidden;background:var(--panel2)}
.sugg button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 12px;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.sugg button:last-child{border-bottom:0}.sugg button:hover{background:rgba(255,255,255,.05)}
.sel-p{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r-sm)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.auth{max-width:400px;margin:12vh auto 0;padding:0 16px}
.auth .card{padding:22px}
.sect{margin-top:22px}
.pre{background:#0a0e13;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font:12px/1.5 var(--mono);overflow:auto;white-space:pre;color:#b9c4d3}

@media(max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  #app{display:block}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30;overflow-x:auto;gap:2px}
  .side .brand,.side .grow,.side .sync{display:none}
  .nav{display:flex;gap:2px;width:100%;justify-content:space-between}
  .wk-t th:nth-child(4),.wk-t td:nth-child(4),.wk-t th:nth-child(6),.wk-t td:nth-child(6){display:none}
  .nav .lg{display:none}.nav .sm{display:inline}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;min-width:52px;text-align:center;position:relative}
  .nav .badge{position:absolute;top:2px;right:6px;margin:0;padding:0 5px}
  .nav a.add svg{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:30px;height:30px;padding:6px;margin-top:-14px}
  main{padding:14px 14px 100px}
  .mtop{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700}
  .mtop .sync{margin-left:auto;padding:0}
  h1{font-size:19px}
  .g2,.g3{grid-template-columns:1fr}.g6,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:20px}
  .prow{grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px}
  .prow.h{display:none}
  .prow .c-x{display:none}
  .filters select,.filters input{min-width:0;flex:1 1 40%}
  .filters input.search{flex:1 1 100%;max-width:none}
  input,select,textarea{font-size:16px}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .cal .wk{display:none}
  .day{min-height:58px;padding:4px;border-radius:7px}.day .s{font-size:10px}.day .n{font-size:10px}
  .modal-back{padding:2vh 8px}
  .hb{grid-template-columns:60px 1fr 84px}
  #toast{bottom:90px}
  .li{flex-wrap:wrap}.li .lb{max-width:none;min-width:0;flex:1 0 100%}
}

</style>

function filterPartners(){
  const u=UI.partners,q=u.q.trim().toLowerCase(),lim=addDays(today(),-60);
  let a=ST.partners.filter(p=>{
    if(u.status==='active'&&!isActive(p))return false;if(u.status==='archive'&&isActive(p))return false;
    if(u.geo&&p.geo!==u.geo)return false;if(u.source&&p.source!==u.source)return false;if(u.buyer&&p.buyer!==u.buyer)return false;
    if(q){const hay=[p.name,p.tracker,p.link,p.manager,p.geo,p.source,p.buyer,...(p.links||[]).map(l=>l.label+' '+l.url),...(p.promos||[]).map(l=>l.label+' '+l.code)].join(' ').toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
    return true});
  const st=p=>PST.get(p.id)||{last:'',total:0};
  if(u.sort==='recent')a.sort((x,y)=>st(y).last.localeCompare(st(x).last)||x.name.localeCompare(y.name));
  else if(u.sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name));
  else if(u.sort==='spend')a.sort((x,y)=>st(y).total-st(x).total);
  return a}

/* ================= weekly report ================= */
function weekData(key,buyer,geo){
  const mon=weekStart(key),sun=addDays(mon,6);const m=new Map();
  for(const e of ents({from:mon,to:sun,buyer,geo}))m.set(e.p,r2((m.get(e.p)||0)+e.a));
  const gi=g=>{const i=ST.settings.geos.indexOf(g);return i<0?99:i},si=s=>{const i=ST.settings.sources.indexOf(s);return i<0?99:i};const pi=new Map(ST.partners.map((p,i)=>[p.id,i]));
  const rows=[...m.entries()].filter(([,v])=>Math.abs(v)>=.005).map(([id,v])=>({p:PM.get(id),v})).sort((a,b)=>gi(a.p.geo)-gi(b.p.geo)||si(a.p.source)-si(b.p.source)||pi.get(a.p.id)-pi.get(b.p.id));
  return {mon,sun,rows}}
function weekTSV(key,rows,header,comma){const f=v=>{const s=v.toFixed(2);return comma?s.replace('.',','):s};
  return (header?['Гео','Источник','Трекер','Неделя','Затраты'].join('\t')+'\n':'')+rows.map(r=>[r.p.geo,r.p.source,r.p.tracker,key,f(r.v)].join('\t')).join('\n')}

/* ================= stats ("Косты") ================= */
function statsData(){
  const u=UI.stats,nb=ST.settings.noBrand;if(!u.year)u.year=today().slice(0,4);
  const es=ents({geo:u.geo,source:u.source,buyer:u.buyer});
  const keyOf=u.mode==='month'?(e=>e.d.slice(0,7)):(e=>weekKey(e.d));
  const rows=new Map();
  for(const e of es){const k=keyOf(e);if(u.mode==='month'?!k.startsWith(u.year):!k.startsWith(u.year+'-'))continue;
    let r=rows.get(k);if(!r)rows.set(k,r={k,by:new Map(),tot:0,cnt:0});const p=PM.get(e.p);const dv=p[u.dim];r.by.set(dv,(r.by.get(dv)||0)+e.a);if(!(nb&&p.source==='BRAND')){r.tot+=e.a;if(e.t==='i')r.cnt++}}
  if(u.mode==='month'){for(const r of ST.fd){if(r.m.startsWith(u.year)&&!rows.has(r.m))rows.set(r.m,{k:r.m,by:new Map(),tot:0,cnt:0})}}
  const keys=[...rows.keys()].sort().reverse();
  const dv=dimList(u.dim).filter(v=>keys.some(k=>Math.abs(rows.get(k).by.get(v)||0)>.004));
  return {u,rows,keys,dv,nb}}
function statsFd(k){const u=UI.stats;return u.buyer?null:fdSum(k,{geo:u.geo,source:u.source})}
function pgStats(){
  const {u,rows,keys,dv,nb}=statsData();const mon=u.mode==='month';

ACT.renList=t=>{const key=t.dataset.key,v=t.dataset.v,f=key==='geos'?'geo':key==='sources'?'source':'buyer';const nv=(prompt('Новое название',v)||'').trim();if(!nv||nv===v)return;
  if(ST.settings[key].includes(nv)){alert('Такое значение уже есть');return}
  ST.settings[key]=ST.settings[key].map(x=>x===v?nv:x);ST.partners.forEach(p=>{if(p[f]===v)p[f]=nv});ST.fd.forEach(r=>{if(f!=='buyer'&&r[f]===v)r[f]=nv});save();render()};
function planForm(pid){
  const p=PM.get(pid),k=openPack(pid),st=k?packStats(k):null,pend=(PP.get(pid)||[]).length;
  const n0=st?Math.max(st.left,0):'',s0=st?(st.leftSum!==null?Math.max(st.leftSum,0):(k.budget||'')):'';
  const m=modalForm('Запланировать интеграции',`<div class="muted" style="margin-bottom:10px">${esc(p.name)}${k?` · пакет: осталось ${st.left} из ${k.count}${st.leftSum!==null?', остаток '+money(st.leftSum):''}`:' · нет активного пакета, укажите количество и сумму вручную'}</div>
   <div class="grid g2"><div>${fld('Сколько интеграций','n',n0,{type:'number',req:1,inputmode:'numeric'})}</div><div>${fld('Сумма на распределение, $','s',s0,{type:'number',step:'0.01',req:1,inputmode:'decimal'})}</div></div>
   <div class="grid g2"><div>${fld('С даты','from',today(),{type:'date',req:1})}</div><div>${fld('По дату (срок)','to',addDays(today(),13),{type:'date',req:1})}</div></div>
   ${pend?`<label class="chk" style="margin-bottom:10px"><input type="checkbox" name="repl" checked> заменить текущие невыполненные планы (${pend})</label>`:''}
   <div id="pl-prev" class="card" style="background:var(--panel2);padding:12px;margin-bottom:8px"></div>`,'Запланировать',f=>{
     const n=Math.floor(+f.n),S=+f.s;if(!(n>=1)||!(S>=0)||f.to<f.from){alert('Проверьте количество, сумму и даты');return false}
     if(f.repl)ST.plans=ST.plans.filter(x=>x.p!==pid||x.done);
     for(const it of planItems(n,S,f.from,f.to))ST.plans.push({id:uid('n'),p:pid,d:it.d,a:it.a,done:false});save();render();toast(`Запланировано: ${n}`)},true);
  const upd=()=>{const g=n=>m.querySelector(`[name=${n}]`).value;const n=Math.floor(+g('n')),S=+g('s'),a=g('from'),z=g('to');const el=m.querySelector('#pl-prev');
    el.innerHTML=(n>=1&&S>=0&&a&&z&&z>=a)?planPreview(planItems(n,S,a,z)):'<span class="muted">Заполните поля — здесь появится расчёт</span>'};
  m.addEventListener('input',upd);upd()}
function packForm(pid,k){
  const p=PM.get(pid),isNew=!k;const pr=curPrice(p);
  k=k||{count:'',budget:'',start:today(),end:'',done0:0,spent0:0,note:''};
  const cur=openPack(pid);
  modalForm(isNew?'Новый пакет интеграций':'Изменить пакет',
   `<div class="muted" style="margin-bottom:10px">${esc(p.name)}${isNew&&cur?'<br><span class="warn">Текущий активный пакет будет закрыт, а новый начнётся с указанной даты.</span>':''}</div>
    <div class="grid g2"><div>${fld('Сколько интеграций','count',k.count,{type:'number',req:1,inputmode:'numeric'})}</div><div>${fld('На какую сумму, $','budget',k.budget||'',{type:'number',step:'0.01',inputmode:'decimal',ph:pr?'напр. '+pr+' × кол-во':''})}</div></div>
    <div class="grid g2"><div>${fld('Начало (с этой даты считаем)','start',k.start,{type:'date',req:1})}</div><div>${fld('Окончание контракта (если есть)','end',k.end,{type:'date'})}</div></div>
    <details ${(+k.done0||+k.spent0)?'open':''}><summary class="muted" style="cursor:pointer;margin-bottom:8px">Уже выполнено до начала учёта в системе</summary><div class="grid g2"><div>${fld('Интеграций уже выпущено','done0',k.done0,{type:'number'})}</div><div>${fld('Потрачено уже, $','spent0',k.spent0,{type:'number',step:'0.01'})}</div></div></details>
    ${fld('Заметка','note',k.note,{tag:'textarea',rows:2})}`,'Сохранить',f=>{
     const data={count:+f.count,budget:f.budget?+f.budget:null,start:f.start,end:f.end||'',done0:+f.done0||0,spent0:+f.spent0||0,note:f.note};
     if(isNew){if(cur){cur.closed=true;if(!cur.end)cur.end=addDays(data.start,-1)}const nk={id:uid('k'),p:pid,closed:false,...data};ST.packs.push(nk);
       for(const e of ST.entries)if(e.p===pid&&!e.k&&e.d>=nk.start&&(!nk.end||e.d<=nk.end))e.k=nk.id}
     else{Object.assign(k,data);for(const e of ST.entries)if(e.p===pid&&!e.k&&e.d>=k.start&&(!k.end||e.d<=k.end))e.k=k.id}
     save();render()})}

const WRITE=new Set(['newPartner','editPartner','bulk','editRef','delRef','newPack','editPack','closePack','reopenPack','addPrice','delPrice','editEntry','delEntry','undoEntry','pickP','clearP','addFd','delFd','renList','delList','toggleNoBrand','planForm','clearPlans','editPlan','delPlan','donePlan','addFor','addDate','export','syncNow','cloudOff']);
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;if(ROLE==='guest'&&WRITE.has(t.dataset.act)){ev.preventDefault();return}const f=ACT[t.dataset.act];if(f)f(t,ev)});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='p-q'){UI.partners.q=t.value;UI.partners.limit=80;$('#p-list').innerHTML=partnerRows()}
  else if(t.id==='ap-a'){UI.add.amount=t.value;UI.add.amountDirty=true;addHint()}
  else if(t.closest('#add-form')&&t.name==='u')UI.add.url=t.value;else if(t.closest('#add-form')&&t.name==='n')UI.add.note=t.value});
document.addEventListener('change',ev=>{const t=ev.target;const d=t.dataset;if(ROLE==='guest'&&(d.fdf||t.id==='imp-file'||t.closest('#add-form')))return;
  if(t.id==='dash-m'){UI.dash.m=t.value;render()}
  else if(d.pf!==undefined){UI.partners[d.pf]=t.type==='checkbox'?t.checked:t.value;UI.partners.limit=80;$('#p-list').innerHTML=partnerRows()}
  else if(d.cf!==undefined){UI.cal[d.cf]=t.value;render()}
  else if(d.wf!==undefined){UI.week[d.wf]=t.type==='checkbox'?t.checked:t.value;render()}
  else if(d.sf!==undefined){UI.stats[d.sf]=t.value;render()}
  else if(t.id==='wk-key'){const v=t.value.trim().toUpperCase();if(/^\d{4}-W\d{1,2}$/.test(v)){const [y,w]=v.split('-W');UI.week.key=`${y}-W${pad(+w)}`}render()}
  else if(d.fdf){const r=ST.fd.find(x=>x.id===d.fdf);if(r){const f=d.f;r[f]=(f==='fd'||f==='fails')?(+t.value||0):t.value.trim().toUpperCase();ensureList('geos',f==='geo'?r.geo:'');ensureList('sources',f==='source'?r.source:'');save();render()}}
  else if(t.closest('#add-form')){const u=UI.add;
    if(t.name==='d'){u.date=t.value;setAmountFromPrice();addHint();addPackInfo()}
    else if(t.name==='t'){u.type=t.value;if(u.type!=='i'){u.amountDirty=false;u.amount='';$('#ap-a').value=''}else setAmountFromPrice();addHint();addPackInfo()}
    else if(t.id==='ap-clear')u.clear=t.checked}
  else if(t.id==='imp-file'){importFile(t.files[0])}});
document.addEventListener('submit',ev=>{const f=ev.target;if(ROLE==='guest'){ev.preventDefault();return}
  if(f.id==='add-form'){ev.preventDefault();const u=UI.add;const fd=Object.fromEntries(new FormData(f));let a=+fd.a;if(!isFinite(a)){return}
    if(u.type==='r')a=-Math.abs(a);const e=addEntry({p:u.pid,d:fd.d||u.date,a:r2(a),t:u.type,u:normLink(fd.u),n:fd.n});u.session.push(e.id);if(u.type==='i'){const pl=planOn(e.p,e.d);if(pl){pl.done=true;pl.entryId=e.id;save()}}
    const p=PM.get(e.p);toast(`Сохранено: ${p.name} · ${money(e.a,2)}`);u.url='';u.note='';u.amountDirty=false;u.amount='';u.date=e.d;if(u.clear||u.type!=='i'){u.pid=''}u.type='i';setAmountFromPrice();render();return}
  const dn=f.dataset.form;if(!dn)return;ev.preventDefault();const fd=Object.fromEntries(new FormData(f));
  if(dn==='addRef'){const p=PM.get(f.dataset.id);const kind=f.dataset.kind;if(kind==='links')p.links.push({id:uid('l'),label:fd.label.trim(),url:fd.value.trim()});else p.promos.push({id:uid('c'),label:fd.label.trim(),code:fd.value.trim()});save();render()}
  else if(dn==='addList'){const v=fd.v.trim();if(!v)return;const key=f.dataset.key;ensureList(key,key==='buyers'?v:v.toUpperCase());save();render()}
  else if(dn==='remind'){ST.settings.remindLeft=+fd.remindLeft||0;ST.settings.remindDays=+fd.remindDays||0;save();render();toast('Сохранено')}
  else if(dn==='guest'){const g=(fd.g||'').trim();if(g.length<4){alert('Минимум 4 символа');return}if(hashCode(g,ST.meta.salt)===ST.meta.codeHash){alert('Гостевой код не должен совпадать с вашим');return}ST.meta.guestSalt=uid('g');ST.meta.guestHash=hashCode(g,ST.meta.guestSalt);save();render();toast('Гостевой код сохранён')}
  else if(dn==='code'){if(hashCode(fd.old,ST.meta.salt)!==ST.meta.codeHash){alert('Текущий код неверный');return}if(fd.n1!==fd.n2){alert('Новые коды не совпадают');return}
    ST.meta.salt=uid('s');ST.meta.codeHash=hashCode(fd.n1,ST.meta.salt);LS.set('mbyar_tok',ST.meta.codeHash);save();f.reset();toast('Код изменён')}
  else if(dn==='cloud'){const url=fd.url.trim(),key=fd.key.trim();if(!/^https?:\/\//.test(url)||!key){alert('Укажите Project URL и ключ');return}
    CL.cfg={url,key,table:'app_state',id:'main'};LS.set('mbyar_cloud',JSON.stringify(CL.cfg));LS.set('mbyar_synced','0');syncPull(true).then(()=>render())}});
function importFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.partners)||!Array.isArray(d.entries))throw new Error('не похоже на файл данных');
  if(!confirm(`Заменить все текущие данные данными из файла?\nПартнёров: ${d.partners.length}, записей: ${d.entries.length}`))return;
  const meta=ST.meta;const nd=Object.assign(DEFAULTS(),d);nd.meta=meta;nd.settings=Object.assign(DEFAULTS().settings,d.settings||{});ST=nd;save();render();toast('Данные загружены')}catch(e){alert('Ошибка импорта: '+e.message)}};r.readAsText(file)}

/* ================= cloud sync ================= */
const CL={cfg:null,status:'off',timer:null};
function setSync(st){CL.status=st;const txt={off:'Только это устройство',ok:'Синхронизировано',busy:'Синхронизация…',err:'Ошибка синхронизации',dirty:'Есть несохранённые в облаке'}[st]||'';
  for(const id of['sync','sync2']){const el=$('#'+id);if(!el)continue;el.className='sync '+(st==='dirty'?'busy':st);el.lastElementChild.textContent=CL.cfg?txt:'Только это устройство';el.title=CL.err||''}}
async function cloudFetch(path,opts={}){const c=CL.cfg;const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/'+path,{...opts,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));const t=await r.text();return t?JSON.parse(t):null}
const cloudRev=async()=>{const a=await cloudFetch(`app_state?id=eq.main&select=rev:data->meta->>rev`);return a&&a[0]?+a[0].rev||0:0};
async function syncPull(manual){
  if(!CL.cfg){return}
  try{setSync('busy');const R=await cloudRev(),L=ST?ST.meta.rev:0,Sy=+LS.get('mbyar_synced')||0;
    if(R===L){LS.set('mbyar_synced',String(L))}
    else if(R>L){if(!ST||L<=Sy||!L||ROLE==='guest'){await adoptRemote()}else await conflict(R)}
    else if(ROLE==='guest'){}else{if(R<=Sy||R===0)await cloudPush();else await conflict(R)}
    setSync('ok');if(manual)toast('Синхронизировано')}
  catch(e){CL.err=String(e.message||e);setSync('err');if(manual)alert('Ошибка синхронизации: '+CL.err)}}
async function adoptRemote(){const a=await cloudFetch('app_state?id=eq.main&select=data');const d=a&&a[0]&&a[0].data;if(!d)return;
  if(!d.plans)d.plans=[];const hadTok=ST&&tokRole();ST=d;persist();reindex();LS.set('mbyar_synced',String(d.meta.rev));
  if(!ST.meta.codeHash){return}
  if(hadTok&&!tokRole()){showLogin();return}
  ROLE=tokRole()||ROLE;
  if($('#root').querySelector('#app'))render()}
async function cloudPush(){const body={id:'main',data:ST,updated_at:new Date().toISOString()};
  await cloudFetch('app_state',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});LS.set('mbyar_synced',String(ST.meta.rev))}
function conflict(R){return new Promise(res=>{const m=modal(`<h2>Данные изменены на двух устройствах</h2><p class="muted">В облаке есть более новые изменения, но и на этом устройстве есть несинхронизированные. Что оставить?</p><div class="row" style="justify-content:flex-end"><button class="btn" id="c-cloud">Взять из облака</button><button class="btn pri" id="c-here">Оставить это устройство</button></div>`);
  $('#c-cloud',m).onclick=async()=>{closeModal();try{await adoptRemote()}catch(e){}res()};
  $('#c-here',m).onclick=async()=>{closeModal();try{await cloudPush()}catch(e){}res()}})}
function schedulePush(){if(!CL.cfg||ROLE==='guest')return;setSync('dirty');clearTimeout(CL.timer);CL.timer=setTimeout(async()=>{
  try{setSync('busy');const R=await cloudRev(),Sy=+LS.get('mbyar_synced')||0;if(R>Sy&&R!==ST.meta.rev){await conflict(R)}else await cloudPush();setSync('ok')}catch(e){CL.err=String(e.message||e);setSync('err')}},1200)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ST&&CL.cfg&&tokRole())syncPull()});

/* ================= auth / boot ================= */
function authShell(inner){$('#root').innerHTML=`<div class="auth"><div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;font-weight:700;font-size:18px"><i style="width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:800">A</i>Учёт рекламы</div>${inner}</div>`}
function showLogin(){
  document.body.classList.remove('ro');
  authShell(`<div class="card"><h2>Вход</h2><form id="login" autocomplete="off"><label class="f">Персональный код<input type="password" name="c" autofocus required autocomplete="current-password" inputmode="text"></label><button class="btn pri" style="width:100%;min-height:42px">Войти</button><div id="login-err" class="bad" style="margin-top:10px;min-height:18px"></div></form></div>`);
  $('#login').addEventListener('submit',async ev=>{ev.preventDefault();const c=new FormData(ev.target).get('c');const b=ev.target.querySelector('button');b.disabled=true;await new Promise(r=>setTimeout(r,30));
    if(hashCode(c,ST.meta.salt)===ST.meta.codeHash){LS.set('mbyar_tok',ST.meta.codeHash);start()}
    else if(ST.meta.guestHash&&hashCode(c,ST.meta.guestSalt)===ST.meta.guestHash){LS.set('mbyar_tok',ST.meta.guestHash);start()}else{await new Promise(r=>setTimeout(r,700));$('#login-err').textContent='Неверный код';ev.target.reset();b.disabled=false}})}
function showSetup(){
  authShell(`<div class="card"><h2>Первый запуск</h2><div class="muted" style="margin-bottom:14px">Придумайте персональный код — только с ним можно будет войти. При желании сразу загрузите файл данных (seed.json).</div>
   <form id="setup" autocomplete="off"><label class="f">Код (минимум 4 символа)<input type="password" name="c1" required minlength="4" autocomplete="new-password"></label><label class="f">Повторите код<input type="password" name="c2" required autocomplete="new-password"></label>
   <label class="f">Файл данных (необязательно)<input type="file" name="file" accept=".json,application/json"></label><button class="btn pri" style="width:100%;min-height:42px">Создать</button><div id="su-err" class="bad" style="margin-top:10px"></div></form>
   <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Уже настроено на другом устройстве?</h3><form id="cloudsu"><label class="f">Project URL<input name="url" placeholder="https://xxxx.supabase.co"></label><label class="f">anon key<input name="key"></label><button class="btn" style="width:100%">Подключиться к облаку</button><div id="cs-err" class="bad" style="margin-top:10px"></div></form></div>`);
  $('#setup').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target),err=$('#su-err');if(f.get('c1')!==f.get('c2')){err.textContent='Коды не совпадают';return}
    const file=f.get('file'),go=d=>{const st=Object.assign(DEFAULTS(),d||{});st.settings=Object.assign(DEFAULTS().settings,(d||{}).settings||{});st.meta={rev:Date.now(),salt:uid('s'),codeHash:''};st.meta.codeHash=hashCode(f.get('c1'),st.meta.salt);ST=st;LS.set('mbyar_tok',st.meta.codeHash);persist();start()};
    if(file&&file.size){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.partners))throw 0;go(d)}catch(e){err.textContent='Файл не похож на файл данных'}};r.readAsText(file)}else go(null)});
  $('#cloudsu').addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target);const url=f.get('url').trim(),key=f.get('key').trim();const err=$('#cs-err');if(!url||!key){err.textContent='Укажите URL и ключ';return}
    CL.cfg={url,key,table:'app_state',id:'main'};try{const a=await cloudFetch('app_state?id=eq.main&select=data');if(!a||!a[0]){err.textContent='В облаке пока пусто. Сначала создайте установку на основном устройстве и включите синхронизацию.';CL.cfg=null;return}
      LS.set('mbyar_cloud',JSON.stringify(CL.cfg));ST=a[0].data;persist();LS.set('mbyar_synced',String(ST.meta.rev));showLogin()}catch(e){err.textContent='Не удалось подключиться: '+e.message;CL.cfg=null}})}
function start(){ROLE=tokRole()||'admin';reindex();render();setSync(CL.cfg?'busy':'off');if(CL.cfg)syncPull()}
async function boot(){
  try{const raw=LS.get('mbyar_state');if(raw)ST=JSON.parse(raw)}catch(e){ST=null}
  CL.cfg=(()=>{try{return JSON.parse(LS.get('mbyar_cloud')||'null')}catch(e){return null}})();
  if(!ST){showSetup();return}
  ST=Object.assign(DEFAULTS(),ST);ST.settings=Object.assign(DEFAULTS().settings,ST.settings);
  if(tokRole())start();else{showLogin();if(CL.cfg)syncPull()}}
boot();
</script>
